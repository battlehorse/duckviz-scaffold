# The kit's tests, then sample apps rendered from the template (every flag on, every flag off) with their own tests,
# and `doctor`.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    # edited: a PR's base can change (a stacked PR retargeted to main), and the spec job must look again
    types: [opened, synchronize, reopened, edited]

jobs:
  kit:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
        working-directory: kit
      - run: uv run ruff check .
        working-directory: kit
      - run: uv run pytest -q --cov=duckkit --cov-report=term
        working-directory: kit
  template:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
      - run: scripts/render.sh

  # Labels a PR that changes the scaffold's spec (.claude/spec-paths) with spec-change: only the user merges those
  # (docs/working.md). Claude's merge hook reads the label, and this job's result.
  spec:
    if: github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
        working-directory: kit
      - name: Spec diff
        id: diff
        run: |
          if uv run --project kit python -m duckkit.specdiff "origin/${{ github.base_ref }}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create spec-change --color D93F0B --description "Changes the spec: the user merges it" --force
          if [ "${{ steps.diff.outputs.changed }}" = true ]; then
            gh pr edit "$PR" --add-label spec-change
          else
            gh pr edit "$PR" --remove-label spec-change || true
          fi
